<h1 class="page-title">My profile</h1>

@if (user(); as u) {
  @if (!u.emailVerified) {
    <div class="verify-banner">
      <mat-icon>mark_email_unread</mat-icon>
      <span>Your email isn't verified yet.</span>
      <button mat-stroked-button (click)="sendVerification()" [disabled]="sendingVerification()">
        Send verification email
      </button>
    </div>
  }

  <mat-card appearance="outlined" class="card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="form">
        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>First name</mat-label>
            <input matInput formControlName="firstName" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Last name</mat-label>
            <input matInput formControlName="lastName" />
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput [value]="u.email" disabled />
          <mat-icon matSuffix [class.ok]="u.emailVerified">{{ u.emailVerified ? 'verified' : 'error_outline' }}</mat-icon>
        </mat-form-field>

        <div class="meta">
          <span><strong>Role:</strong> {{ u.role }}</span>
          <span><strong>Member since:</strong> {{ u.createdAt | date: 'mediumDate' }}</span>
        </div>

        <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">Save changes</button>
      </form>
    </mat-card-content>
  </mat-card>
}
