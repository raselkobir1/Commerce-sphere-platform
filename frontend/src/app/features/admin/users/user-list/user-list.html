<h1 class="page-title">Users</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-card">
  <table mat-table [dataSource]="users()" class="full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let u">{{ u.firstName }} {{ u.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">
        {{ u.email }}
        @if (u.emailVerified) {
          <mat-icon class="verified" [inline]="true">verified</mat-icon>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u">
        <span class="chip" [class.admin]="u.role === 'Admin'">{{ u.role }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let u">
        <span class="chip" [class.active]="u.isActive">{{ u.isActive ? 'Active' : 'Inactive' }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="created">
      <th mat-header-cell *matHeaderCellDef>Joined</th>
      <td mat-cell *matCellDef="let u">{{ u.createdAt | date: 'mediumDate' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)"
  />
</div>
