<h1 class="page-title">Inventory</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-card">
  <table mat-table [dataSource]="items()" class="full">
    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef>SKU</th>
      <td mat-cell *matCellDef="let i">{{ i.sku }}</td>
    </ng-container>
    <ng-container matColumnDef="onHand">
      <th mat-header-cell *matHeaderCellDef>On hand</th>
      <td mat-cell *matCellDef="let i">{{ i.quantityOnHand }}</td>
    </ng-container>
    <ng-container matColumnDef="reserved">
      <th mat-header-cell *matHeaderCellDef>Reserved</th>
      <td mat-cell *matCellDef="let i">{{ i.quantityReserved }}</td>
    </ng-container>
    <ng-container matColumnDef="available">
      <th mat-header-cell *matHeaderCellDef>Available</th>
      <td mat-cell *matCellDef="let i">
        <span [class.low]="isLow(i)">{{ i.quantityAvailable }}</span>
        @if (isLow(i)) {
          <span class="low-tag">Low</span>
        }
      </td>
    </ng-container>
    <ng-container matColumnDef="reorder">
      <th mat-header-cell *matHeaderCellDef>Reorder at</th>
      <td mat-cell *matCellDef="let i">{{ i.reorderLevel }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Receive stock</th>
      <td mat-cell *matCellDef="let i" class="actions">
        <input #qty type="number" min="1" placeholder="Qty" class="qty" />
        <button mat-stroked-button (click)="receive(i, qty.value); qty.value = ''">
          <mat-icon>add</mat-icon> Receive
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[20, 50, 100]"
    (page)="onPage($event)"
  />
</div>
