<h1 class="page-title">{{ isEdit() ? 'Edit product' : 'New product' }}</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<mat-card appearance="outlined" class="card">
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="save()" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>SKU</mat-label>
          <input matInput formControlName="sku" />
          @if (isEdit()) {
            <mat-hint>SKU can't be changed</mat-hint>
          }
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Category</mat-label>
          <input matInput formControlName="category" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Price</mat-label>
          <input matInput type="number" min="0" step="0.01" formControlName="price" />
          <span matTextPrefix>$&nbsp;</span>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Initial stock</mat-label>
          <input matInput type="number" min="0" formControlName="initialStock" />
          @if (isEdit()) {
            <mat-hint>Adjust stock from Inventory</mat-hint>
          }
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Image URL (optional)</mat-label>
        <input matInput formControlName="imageUrl" />
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="loading() || form.invalid">
          {{ isEdit() ? 'Save changes' : 'Create product' }}
        </button>
        <a mat-button routerLink="/admin/products">Cancel</a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
