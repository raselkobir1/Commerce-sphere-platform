<div class="page-head">
  <h1 class="page-title">Products</h1>
  <a mat-flat-button color="primary" routerLink="/admin/products/new">
    <mat-icon>add</mat-icon> New product
  </a>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-card">
  <table mat-table [dataSource]="products()" class="full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let p">{{ p.name }}</td>
    </ng-container>
    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef>SKU</th>
      <td mat-cell *matCellDef="let p">{{ p.sku }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let p">{{ p.price | currency }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let p">{{ p.category }}</td>
    </ng-container>
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let p">{{ p.stock }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let p">
        <span class="chip" [class.active]="p.isActive">{{ p.isActive ? 'Active' : 'Inactive' }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p" class="actions">
        <a mat-icon-button [routerLink]="['/admin/products', p.id, 'edit']" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="toggleActive(p)" [attr.aria-label]="p.isActive ? 'Deactivate' : 'Activate'">
          <mat-icon>{{ p.isActive ? 'toggle_on' : 'toggle_off' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)"
  />
</div>
