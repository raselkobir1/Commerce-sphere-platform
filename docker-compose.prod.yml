# docker-compose.prod.yml — production deployment overlay.
# Must be combined explicitly with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Secrets: copy .env.production.example → .env.production and fill in real values.
# In CI/CD pipelines (GitHub Actions, GitLab CI): inject as environment variables
# instead of writing .env.production to disk.

services:

  # ─── Services: production mode ─────────────────────────────────────────────
  # • ASPNETCORE_ENVIRONMENT=Production  → Swagger off, minimal error detail
  # • No ports exposed except the API Gateway on :5000
  # • Secrets come from .env.production (gitignored)

  auth-service:
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDb: "Host=postgres-auth;Port=5432;Database=auth_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-60}"
      Kafka__BootstrapServers: "kafka:9092"
      # Social login (OAuth). Provider credentials come from .env.production; a blank pair hides
      # that provider. CallbackBaseUrl must be your real public origin (the API Gateway URL).
      Sso__CallbackBaseUrl: "https://your-domain.com"  # ← change to real domain
      Sso__CallbackPath: "/api/auth/sso/callback"
      Sso__AllowedRedirectUris__0: "https://your-admin-portal.com"   # ← change to real origins
      Sso__AllowedRedirectUris__1: "https://your-shop-portal.com"
      Sso__Providers__google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Sso__Providers__google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Sso__Providers__facebook__ClientId: "${FACEBOOK_CLIENT_ID:-}"
      Sso__Providers__facebook__ClientSecret: "${FACEBOOK_CLIENT_SECRET:-}"

  product-service:
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ProductDb: "Host=postgres-product;Port=5432;Database=product_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Kafka__BootstrapServers: "kafka:9092"

  inventory-service:
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__InventoryDb: "Host=postgres-inventory;Port=5432;Database=inventory_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Kafka__BootstrapServers: "kafka:9092"

  cart-service:
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CartDb: "Host=postgres-cart;Port=5432;Database=cart_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Kafka__BootstrapServers: "kafka:9092"

  chat-service:
    env_file: .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ChatDb: "Host=postgres-chat;Port=5432;Database=chat_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

  api-gateway:
    env_file: .env.production
    ports:
      - "5000:80"   # only port exposed to the internet
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

  # ─── PostgreSQL: production hardening ──────────────────────────────────────
  # No ports exposed — only reachable within the Docker network.

  postgres-auth:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  postgres-product:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  postgres-inventory:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  postgres-cart:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  postgres-chat:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
