version: "3.9"

networks:
  commerce-net:
    driver: bridge

volumes:
  pgdata-auth:
  pgdata-product:
  pgdata-inventory:
  pgdata-cart:
  pgdata-keycloak:
  redis-data:
  kafka-data:

services:

  # ─── Infrastructure ───────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-product:
    image: postgres:16-alpine
    container_name: postgres-product
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
    volumes:
      - pgdata-product:/var/lib/postgresql/data
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
    volumes:
      - pgdata-inventory:/var/lib/postgresql/data
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-cart:
    image: postgres:16-alpine
    container_name: postgres-cart
    restart: unless-stopped
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
    volumes:
      - pgdata-cart:/var/lib/postgresql/data
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d cart_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka in KRaft mode (no ZooKeeper) — confluentinc/cp-kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Keycloak's own PostgreSQL — separate from auth_db to avoid schema conflicts.
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
    volumes:
      - pgdata-keycloak:/var/lib/postgresql/data
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak — acts as the Identity Broker for all social logins (Google, GitHub, Facebook).
  # After a social login, Keycloak redirects back to Auth Service /api/auth/sso/callback with a code.
  #
  # The realm "commerce-sphere" is auto-imported from keycloak/realm-export.json on first boot
  # (--import-realm flag). The import is skipped if the realm already exists.
  #
  # Before first boot you MUST:
  #   1. Replace GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in realm-export.json (or in the Keycloak
  #      admin console after startup) with real credentials from console.cloud.google.com.
  #   2. Do the same for GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET (github.com → Settings → OAuth Apps).
  #   3. Do the same for FACEBOOK_APP_ID / FACEBOOK_APP_SECRET (developers.facebook.com).
  #   4. Replace CHANGE_ME_IN_KEYCLOAK_ADMIN (client secret) in Keycloak admin UI and set the same
  #      value in Keycloak__ClientSecret env var below (or in a .env file / secrets manager).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    # start-dev enables HTTP (no TLS required) and disables hostname validation — suitable for local dev.
    # --import-realm auto-imports keycloak/realm-export.json if the realm does not yet exist.
    # For production use `start` with a proper TLS certificate and hostname configuration.
    command: start-dev --import-realm
    volumes:
      # Mount the realm export read-only; Keycloak imports it on first start, skips on subsequent.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: commerce
      KC_DB_PASSWORD: commerce_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_pass
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - commerce-net
    healthcheck:
      # Keycloak's ubi9-minimal image has no curl/wget — use bash /dev/tcp to HTTP-check
      # the /realms/master endpoint, which returns 200 only once Keycloak is fully started.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Microservices ────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: src/Services/Auth/CommerceSphere.AuthService.API/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__AuthDb: "Host=postgres-auth;Port=5432;Database=auth_db;Username=commerce;Password=commerce_pass;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "CommerceSphere_SuperSecret_JWT_Key_2024_Min32Chars!!"
      Jwt__Issuer: "CommerceSphere"
      Jwt__Audience: "CommerceSphereClients"
      Jwt__ExpiryMinutes: "60"
      Kafka__BootstrapServers: "kafka:9092"
      Keycloak__Authority: "http://keycloak:8080/realms/commerce-sphere"
      Keycloak__ClientId: "commerce-sphere-client"
      Keycloak__ClientSecret: "CommerceSphereDevSecret2024!"
      Keycloak__CallbackBaseUrl: "http://localhost:5000"
      Keycloak__CallbackPath: "/api/auth/sso/callback"
      Keycloak__Providers__0: "google"
      Keycloak__Providers__1: "github"
      Keycloak__Providers__2: "facebook"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  product-service:
    build:
      context: .
      dockerfile: src/Services/Product/CommerceSphere.ProductService.API/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__ProductDb: "Host=postgres-product;Port=5432;Database=product_db;Username=commerce;Password=commerce_pass;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "CommerceSphere_SuperSecret_JWT_Key_2024_Min32Chars!!"
      Jwt__Issuer: "CommerceSphere"
      Jwt__Audience: "CommerceSphereClients"
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: src/Services/Inventory/CommerceSphere.InventoryService.API/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__InventoryDb: "Host=postgres-inventory;Port=5432;Database=inventory_db;Username=commerce;Password=commerce_pass;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "CommerceSphere_SuperSecret_JWT_Key_2024_Min32Chars!!"
      Jwt__Issuer: "CommerceSphere"
      Jwt__Audience: "CommerceSphereClients"
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  cart-service:
    build:
      context: .
      dockerfile: src/Services/Cart/CommerceSphere.CartService.API/Dockerfile
    container_name: cart-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__CartDb: "Host=postgres-cart;Port=5432;Database=cart_db;Username=commerce;Password=commerce_pass;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "CommerceSphere_SuperSecret_JWT_Key_2024_Min32Chars!!"
      Jwt__Issuer: "CommerceSphere"
      Jwt__Audience: "CommerceSphereClients"
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      postgres-cart:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - commerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── API Gateway ─────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/CommerceSphere.ApiGateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      Jwt__Secret: "CommerceSphere_SuperSecret_JWT_Key_2024_Min32Chars!!"
      Jwt__Issuer: "CommerceSphere"
      Jwt__Audience: "CommerceSphereClients"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    networks:
      - commerce-net
