# docker-compose.override.yml — auto-loaded by `docker compose up`.
# Sets ASPNETCORE_ENVIRONMENT=Development for all services (enables Swagger, detailed errors).
# Exposes every port to the host for direct access with TablePlus, Postman, Kafka UI, etc.
# Adds dev-only tools: Kafka UI, pgAdmin.
#
# To run ONLY infrastructure (services run locally with dotnet run):
#   docker compose up -d postgres-auth postgres-product postgres-inventory postgres-cart redis kafka
#
# To override a single value locally without touching this file:
#   create docker-compose.local.yml (gitignored) and use -f docker-compose.local.yml

services:

  # ─── Services: switch to Development mode ──────────────────────────────────
  # ASPNETCORE_ENVIRONMENT=Development activates:
  #   • appsettings.Development.json
  #   • Swagger UI at /swagger
  #   • Detailed exception pages

  auth-service:
    env_file: .env.development
    ports:
      - "5211:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: "Host=postgres-auth;Port=5432;Database=auth_db;Username=${POSTGRES_USER:-commerce};Password=${POSTGRES_PASSWORD:-commerce_pass};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"
      Jwt__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-60}"
      Kafka__BootstrapServers: "kafka:9092"
      # Social login (OAuth). Credentials come from each provider's developer console — supply them
      # via .env.development to enable a provider; a blank ClientId/Secret hides that provider.
      Sso__CallbackBaseUrl: "http://localhost:5000"
      Sso__CallbackPath: "/api/auth/sso/callback"
      # SSO tokens may only be redirected back to these frontend origins (open-redirect guard).
      Sso__AllowedRedirectUris__0: "http://localhost:4200"
      Sso__AllowedRedirectUris__1: "http://localhost:4300"
      Sso__Providers__google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Sso__Providers__google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Sso__Providers__facebook__ClientId: "${FACEBOOK_CLIENT_ID:-}"
      Sso__Providers__facebook__ClientSecret: "${FACEBOOK_CLIENT_SECRET:-}"
      Email__SmtpHost: "mailpit"
      Email__SmtpPort: "1025"
      Email__AppBaseUrl: "http://localhost:5000"
      Email__AdminPortalUrl: "http://localhost:4200"
      Email__ShopPortalUrl: "http://localhost:4300"

  product-service:
    env_file: .env.development
    ports:
      - "5095:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProductDb: "Host=postgres-product;Port=5432;Database=product_db;Username=${POSTGRES_USER:-commerce};Password=${POSTGRES_PASSWORD:-commerce_pass};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"
      Kafka__BootstrapServers: "kafka:9092"

  inventory-service:
    env_file: .env.development
    ports:
      - "5035:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDb: "Host=postgres-inventory;Port=5432;Database=inventory_db;Username=${POSTGRES_USER:-commerce};Password=${POSTGRES_PASSWORD:-commerce_pass};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"
      Kafka__BootstrapServers: "kafka:9092"

  cart-service:
    env_file: .env.development
    ports:
      - "5236:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CartDb: "Host=postgres-cart;Port=5432;Database=cart_db;Username=${POSTGRES_USER:-commerce};Password=${POSTGRES_PASSWORD:-commerce_pass};"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectRetry=3"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"
      Kafka__BootstrapServers: "kafka:9092"

  notification-service:
    env_file: .env.development
    ports:
      - "5240:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Host=postgres-notification;Port=5432;Database=notification_db;Username=${POSTGRES_USER:-commerce};Password=${POSTGRES_PASSWORD:-commerce_pass};"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"
      Kafka__BootstrapServers: "kafka:9092"
      Email__SmtpHost: "mailpit"
      Email__SmtpPort: "1025"

  chat-service:
    env_file: .env.development
    ports:
      - "5245:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ChatDb: "Host=postgres-chat;Port=5432;Database=chat_db;Username=${POSTGRES_USER:-commerce};Password=${POSTGRES_PASSWORD:-commerce_pass};"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"

  api-gateway:
    env_file: .env.development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER:-CommerceSphere}"
      Jwt__Audience: "${JWT_AUDIENCE:-CommerceSphereClients}"

  # ─── Infrastructure: expose ports to host ──────────────────────────────────

  postgres-auth:
    ports:
      - "5433:5432"

  postgres-product:
    ports:
      - "5434:5432"

  postgres-inventory:
    ports:
      - "5435:5432"

  postgres-cart:
    ports:
      - "5436:5432"

  postgres-notification:
    ports:
      - "5438:5432"

  postgres-chat:
    ports:
      - "5437:5432"

  redis:
    ports:
      - "6379:6379"

  # ─── Dev tools ─────────────────────────────────────────────────────────────

  # Kafka UI — browse topics, consumer groups, messages at http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: commerce-sphere
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - commerce-net

  # pgAdmin — manage all PostgreSQL databases at http://localhost:5050
  # Login: admin@commercesphere.dev / admin
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@commercesphere.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - commerce-net

  # Mailpit — local SMTP trap. Catches all outbound emails (no real delivery).
  # Web UI at http://localhost:8025 — view verification emails, OTP codes, reset links.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - commerce-net

volumes:
  pgadmin-data:
